<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leygen</title>
<meta name="description" content="Prototyp av Leygen, en lägenhetsplattform. Alla annonser är påhittade.">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light;
    --paper: #f6f1e7;
    --card: #fffdf8;
    --ink: #1f2a26;
    --muted: #5c6a64;
    --line: #dcd4c4;
    --accent: #1f5c4a;
    --accent-ink: #ffffff;
    --notice: #f0dfb4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  a { color: var(--accent); }
  h1, h2 { font-family: var(--serif); font-weight: 600; line-height: 1.15; }
  .notice { background: var(--notice); padding: 8px 16px; font-size: 14px; text-align: center; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 8px; }
  .brand { font: 600 26px var(--serif); color: var(--ink); text-decoration: none; }
  .hero { padding: 16px 0 24px; }
  .hero h1 { font-size: clamp(32px, 6vw, 52px); margin: 0 0 8px; max-width: 16em; }
  .hero p { margin: 0; color: var(--muted); font-size: 18px; }
  form.filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  label { display: block; font-size: 14px; font-weight: 600; }
  select, textarea { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; font: 16px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .count { margin: 20px 0 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding-bottom: 48px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .12s ease, box-shadow .12s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(31, 42, 38, .12); }
  .card svg, .detail-art svg { display: block; width: 100%; height: auto; }
  .card-body { padding: 14px 16px 16px; }
  .card h2 { font-size: 21px; margin: 0 0 4px; }
  .place, .facts { color: var(--muted); font-size: 15px; margin: 0; }
  .rent { font-weight: 700; margin: 8px 0 0; }
  .tag { display: inline-block; margin-top: 8px; padding: 2px 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
  .empty { padding: 32px 0 64px; }
  .back { display: inline-block; margin: 8px 0 16px; }
  .detail { display: grid; grid-template-columns: 3fr 2fr; gap: 28px; padding-bottom: 56px; align-items: start; }
  .detail-art { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .detail h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 22px; margin: 0 0 12px; }
  .panel .big { font-size: 26px; font-weight: 700; margin: 0; }
  button { margin-top: 12px; width: 100%; padding: 12px; font: 600 16px var(--sans); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: #17483a; }
  .small { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .sent { margin: 12px 0 0; padding: 12px; background: #e3efe8; border-radius: 8px; }
  :focus-visible { outline: 3px solid #c98a1b; outline-offset: 2px; }
  @media (max-width: 760px) {
    form.filters { grid-template-columns: 1fr 1fr; }
    .detail { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="notice">Prototyp: alla annonser är påhittade och inget du skriver här skickas eller sparas.</div>
<div class="wrap">
  <header><a class="brand" href="#/">Leygen</a></header>
  <main id="app"></main>
</div>
<script>
  const LISTINGS = [
    { id: "lindgatan", title: "Ljus tvåa med balkong", street: "Lindgatan 12", area: "Södermalm", city: "Stockholm", rooms: 2, sqm: 54, floor: 3, rent: 12400, deposit: 12400, lease: "Andrahand", from: "1 december 2026", until: "30 november 2027", furnished: true, pets: false, color: "#b5533c", text: "Trivsam tvåa med morgonsol på balkongen. Nyrenoverat kök och tvättstuga i huset. Lägenheten hyrs ut möblerad under ett år." },
    { id: "hamngatan", title: "Etta nära havet", street: "Hamngatan 4", area: "Majorna", city: "Göteborg", rooms: 1, sqm: 32, floor: 2, rent: 7900, deposit: 7900, lease: "Andrahand", from: "15 december 2026", until: "31 augusti 2027", furnished: true, pets: false, color: "#3f6f8a", text: "Smart planerad etta i landshövdingehus. Spårvagnen stannar runt hörnet och det tar tio minuter att promenera till älven." },
    { id: "kastanjevagen", title: "Rymlig trea för familjen", street: "Kastanjevägen 8", area: "Västra Hamnen", city: "Malmö", rooms: 3, sqm: 78, floor: 4, rent: 13800, deposit: null, lease: "Förstahand", from: "1 januari 2027", until: null, furnished: false, pets: true, color: "#c28f2c", text: "Modern trea med två sovrum och stor vardagsrumsdel. Gemensam innergård med lekplats och cykelrum i källaren." },
    { id: "svartbacken", title: "Studentvänlig etta", street: "Björkgatan 21", area: "Svartbäcken", city: "Uppsala", rooms: 1, sqm: 28, floor: 1, rent: 6500, deposit: 6500, lease: "Andrahand", from: "1 januari 2027", until: "30 juni 2027", furnished: true, pets: false, color: "#6d7f4f", text: "Praktisk etta med pentry och sovalkov. Cykelavstånd till universitetet och matbutik i samma kvarter." },
    { id: "ekvagen", title: "Fyra med egen uteplats", street: "Ekvägen 3", area: "Hägersten", city: "Stockholm", rooms: 4, sqm: 96, floor: 0, rent: 17900, deposit: null, lease: "Förstahand", from: "1 februari 2027", until: null, furnished: false, pets: true, color: "#7a5a86", text: "Markplan med egen uteplats mot grönområde. Tre sovrum, två badrum och förråd. Tunnelbanan ligger fem minuter bort." },
    { id: "vasagatan", title: "Charmig tvåa i sekelskifteshus", street: "Klippgatan 17", area: "Linné", city: "Göteborg", rooms: 2, sqm: 58, floor: 3, rent: 11200, deposit: 11200, lease: "Andrahand", from: "1 januari 2027", until: "31 december 2027", furnished: false, pets: true, color: "#a0654a", text: "Högt i tak, bevarade detaljer och kakelugn. Kort promenad till caféer, parker och kollektivtrafik." }
  ];

  const app = document.getElementById("app");
  const filters = { city: "", rent: "", rooms: "", lease: "" };
  const sent = new Set();

  const kr = n => n.toLocaleString("sv-SE") + " kr";
  const roomWord = n => n === 1 ? "1 rum" : n + " rum";

  // Bilderna är ritade fasader eftersom annonserna inte finns på riktigt.
  function facade(l) {
    const cols = 4 + l.rooms % 3, rows = 3;
    const w = 400 / (cols + 1);
    let windows = "";
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const lit = (c * 3 + r * 5 + l.sqm) % 4 === 0;
        windows += `<rect x="${w * (c + .75)}" y="${50 + r * 58}" width="${w * .5}" height="38" rx="2" fill="${lit ? "#f6d98b" : "#fffdf8"}" opacity="${lit ? 1 : .55}"/>`;
      }
    }
    return `<svg viewBox="0 0 400 240" role="img" aria-label="Illustration av ett hus">
      <rect width="400" height="240" fill="${l.color}"/>
      <rect y="0" width="400" height="24" fill="#1f2a26" opacity=".18"/>
      ${windows}
      <rect y="222" width="400" height="18" fill="#1f2a26" opacity=".3"/>
    </svg>`;
  }

  function matches(l) {
    return (!filters.city || l.city === filters.city)
      && (!filters.rent || l.rent <= Number(filters.rent))
      && (!filters.rooms || l.rooms >= Number(filters.rooms))
      && (!filters.lease || l.lease === filters.lease);
  }

  function option(value, label, selected) {
    return `<option value="${value}"${String(selected) === String(value) ? " selected" : ""}>${label}</option>`;
  }

  function renderList() {
    const cities = [...new Set(LISTINGS.map(l => l.city))].sort((a, b) => a.localeCompare(b, "sv"));
    app.innerHTML = `
      <section class="hero">
        <h1>Hitta nästa hem utan krångel.</h1>
        <p>Sök bland lägenheter att hyra och anmäl ditt intresse direkt.</p>
      </section>
      <form class="filters" aria-label="Filtrera annonser">
        <label>Stad<select name="city">${option("", "Alla städer", filters.city)}${cities.map(c => option(c, c, filters.city)).join("")}</select></label>
        <label>Högsta hyra<select name="rent">${option("", "Ingen gräns", filters.rent)}${[8000, 12000, 15000].map(v => option(v, kr(v), filters.rent)).join("")}</select></label>
        <label>Minst antal rum<select name="rooms">${option("", "Alla", filters.rooms)}${[2, 3, 4].map(v => option(v, v + " rum", filters.rooms)).join("")}</select></label>
        <label>Kontrakt<select name="lease">${option("", "Alla", filters.lease)}${option("Förstahand", "Förstahand", filters.lease)}${option("Andrahand", "Andrahand", filters.lease)}</select></label>
      </form>
      <div id="results"></div>`;
    app.querySelector("form").addEventListener("change", e => {
      filters[e.target.name] = e.target.value;
      renderResults();
    });
    renderResults();
  }

  function renderResults() {
    const hits = LISTINGS.filter(matches);
    const results = document.getElementById("results");
    if (!hits.length) {
      results.innerHTML = `<p class="empty">Inga annonser matchar din sökning. Prova att ändra filtren.</p>`;
      return;
    }
    results.innerHTML = `
      <p class="count" aria-live="polite">${hits.length} ${hits.length === 1 ? "annons" : "annonser"}</p>
      <div class="grid">${hits.map(l => `
        <a class="card" href="#/annons/${l.id}">
          ${facade(l)}
          <div class="card-body">
            <h2>${l.title}</h2>
            <p class="place">${l.area}, ${l.city}</p>
            <p class="facts">${roomWord(l.rooms)} · ${l.sqm} m²</p>
            <p class="rent">${kr(l.rent)}/mån</p>
            <span class="tag">${l.lease}</span>
          </div>
        </a>`).join("")}
      </div>`;
  }

  function renderDetail(l) {
    const applied = sent.has(l.id);
    app.innerHTML = `
      <a class="back" href="#/">← Alla annonser</a>
      <article class="detail">
        <div>
          <div class="detail-art">${facade(l)}</div>
          <h1 style="margin-top:20px">${l.title}</h1>
          <p class="place">${l.street}, ${l.area}, ${l.city}</p>
          <p>${l.text}</p>
          <dl>
            <dt>Storlek</dt><dd>${roomWord(l.rooms)}, ${l.sqm} m²</dd>
            <dt>Våning</dt><dd>${l.floor === 0 ? "Markplan" : l.floor}</dd>
            <dt>Kontrakt</dt><dd>${l.lease}</dd>
            <dt>Ledig från</dt><dd>${l.from}</dd>
            <dt>Ledig till</dt><dd>${l.until || "Tillsvidare"}</dd>
            <dt>Möblerad</dt><dd>${l.furnished ? "Ja" : "Nej"}</dd>
            <dt>Husdjur</dt><dd>${l.pets ? "Tillåtna" : "Inte tillåtna"}</dd>
          </dl>
        </div>
        <aside class="panel">
          <p class="big">${kr(l.rent)}/mån</p>
          <p class="small">${l.deposit ? "Deposition " + kr(l.deposit) : "Ingen deposition"}</p>
          <h2 style="margin-top:20px">Anmäl intresse</h2>
          ${applied ? sentMessage() : `
          <form id="apply">
            <label>Meddelande till hyresvärden (demo)
              <textarea name="message" rows="4" placeholder="Skriv inga riktiga personuppgifter här."></textarea>
            </label>
            <button type="submit">Skicka intresseanmälan</button>
            <p class="small">Det här är en demo. Inget skickas.</p>
          </form>`}
        </aside>
      </article>`;
    const form = document.getElementById("apply");
    if (form) {
      form.addEventListener("submit", e => {
        e.preventDefault();
        sent.add(l.id);
        form.outerHTML = sentMessage();
      });
    }
  }

  function sentMessage() {
    return `<p class="sent" role="status">Så här ser det ut när intresseanmälan är skickad. I prototypen skickades inget på riktigt.</p>`;
  }

  function route() {
    const match = location.hash.match(/^#\/annons\/([\w-]+)$/);
    const listing = match && LISTINGS.find(l => l.id === match[1]);
    document.title = listing ? listing.title + " · Leygen" : "Leygen";
    if (listing) renderDetail(listing); else renderList();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
